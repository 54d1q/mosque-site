version: "3.8"

services:
  app:
    build: .
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      # Connects using the variables below
      - DATABASE_URL=postgres://${ORCALE_DB_USER}:${ORCALE_DB_PASSWORD}@db:5432/${ORCALE_DB_NAME}
    env_file:
      - backend/.env
    depends_on:
      - db

  # 2. The Database (Postgres)
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${ORCALE_DB_USER}
      POSTGRES_PASSWORD: ${ORCALE_DB_PASSWORD}
      POSTGRES_DB: ${ORCALE_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
