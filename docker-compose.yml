version: "3.8"

services:
  # 1. Your Website
  app:
    build: .
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      # CRITICAL: Host is changed from 'localhost' to 'db'
      - DATABASE_URL=postgres://postgres:20643@db:5432/project1_db
    env_file:
      - backend/.env
    depends_on:
      - db

  # 2. The Database (Postgres)
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20643
      POSTGRES_DB: project1_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
