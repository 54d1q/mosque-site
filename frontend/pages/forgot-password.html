<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - SMIC</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f7f6;
        font-family: sans-serif;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      h2 {
        color: #1e4d2b;
        margin-bottom: 10px;
      }
      p {
        color: #666;
        margin-bottom: 20px;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .btn-green {
        width: 100%;
        padding: 12px;
        background: #1e4d2b;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
      }
      .btn-green:hover {
        background: #14361e;
      }
      .back-link {
        display: block;
        margin-top: 15px;
        color: #1e4d2b;
        text-decoration: none;
        font-size: 0.9rem;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="/images/mosque-logo.png"
        alt="Logo"
        style="width: 60px; margin-bottom: 10px"
      />
      <h2>Forgot Password?</h2>
      <p>
        Enter your email address and we'll send you a link to reset your
        password.
      </p>

      <form id="forgot-form">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
        <button type="submit" class="btn-green">Send Reset Link</button>
      </form>

      <p id="msg" style="margin-top: 15px; font-weight: bold"></p>
      <a href="/login" class="back-link">← Back to Login</a>
    </div>

    <script>
      document
        .getElementById("forgot-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const msg = document.getElementById("msg");
          const btn = e.target.querySelector("button");

          btn.disabled = true;
          btn.innerText = "Sending...";
          msg.innerText = "";

          try {
            const res = await fetch("/api/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });

            const data = await res.json();

            // For security, we usually say "If account exists..." but here we show the message from server
            msg.style.color = "green";
            msg.innerText =
              data.message ||
              "If that email is registered, a link has been sent.";
            btn.innerText = "Link Sent";
          } catch (err) {
            console.error(err);
            msg.style.color = "red";
            msg.innerText = "Connection Error";
            btn.disabled = false;
            btn.innerText = "Send Reset Link";
          }
        });
    </script>
  </body>
</html>
