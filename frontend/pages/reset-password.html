<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - SMIC</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f7f6;
        font-family: sans-serif;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .btn-green {
        width: 100%;
        padding: 12px;
        background: #1e4d2b;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
      }
      .btn-green:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      /* Requirement List Styles */
      #pass-requirements {
        list-style: none;
        padding: 0;
        margin-top: 5px;
        text-align: left;
      }
      .req-item {
        font-size: 0.85rem;
        color: #777;
        margin-bottom: 3px;
        transition: color 0.3s;
      }
      .req-valid {
        color: #27ae60;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card" style="text-align: center">
      <img
        src="/images/mosque-logo.png"
        alt="Logo"
        style="width: 60px; margin-bottom: 10px"
      />
      <h2 style="color: #1e4d2b">Set New Password</h2>

      <form id="reset-form">
        <input
          type="password"
          id="new-pass"
          placeholder="New Password"
          required
        />

        <ul id="pass-requirements">
          <li id="req-len" class="req-item">• At least 8 characters long</li>
          <li id="req-upper" class="req-item">• One uppercase letter</li>
          <li id="req-lower" class="req-item">• One lowercase letter</li>
          <li id="req-num" class="req-item">• One number</li>
          <li id="req-spec" class="req-item">• One special character (!@#$)</li>
        </ul>

        <button type="submit" class="btn-green" style="margin-top: 15px">
          Update Password
        </button>
      </form>
      <p id="msg" style="margin-top: 15px; font-weight: bold"></p>
    </div>

    <script>
      // --- REAL-TIME VALIDATION ---
      const passInput = document.getElementById("new-pass");

      passInput.addEventListener("input", function () {
        const val = this.value;
        updateReq("req-len", val.length >= 8);
        updateReq("req-upper", /[A-Z]/.test(val));
        updateReq("req-lower", /[a-z]/.test(val));
        updateReq("req-num", /\d/.test(val));
        updateReq("req-spec", /[\W_]/.test(val));
      });

      function updateReq(id, isValid) {
        const el = document.getElementById(id);
        if (isValid) {
          el.classList.add("req-valid");
          el.innerHTML = "✔ " + el.innerHTML.substring(2); // Change bullet to tick
          if (el.innerHTML.includes("••"))
            el.innerHTML = el.innerHTML.replace("••", "•"); // cleanup
        } else {
          el.classList.remove("req-valid");
          el.innerHTML = "• " + el.innerHTML.substring(2); // Revert to bullet
        }
      }

      // --- SUBMISSION LOGIC ---
      document
        .getElementById("reset-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const newPassword = passInput.value;
          const msg = document.getElementById("msg");
          const btn = e.target.querySelector("button");
          const urlParams = new URLSearchParams(window.location.search);
          const token = urlParams.get("token");

          if (!token) return (msg.innerText = "Error: Missing token.");

          btn.disabled = true;
          btn.innerText = "Updating...";

          try {
            const res = await fetch("/api/reset-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, newPassword }),
            });
            const data = await res.json();

            if (data.success) {
              msg.style.color = "green";
              msg.innerText = "✅ Success! Redirecting...";
              setTimeout(() => (window.location.href = "/login"), 2000);
            } else {
              msg.style.color = "red";
              msg.innerText = "❌ " + data.message;
              btn.disabled = false;
              btn.innerText = "Update Password";
            }
          } catch (err) {
            console.error(err);
            msg.innerText = "Connection Error";
          }
        });
    </script>
  </body>
</html>
